<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Smart Quiz – Brain Training</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pk: #ff7eb6;
        --yl: #ffd93d;
        --pu: #7c4dff;
        --cy: #35d6ed;
        --or: #ff9248;
        --sk: #8fd3ff;
        --ink: #2b1b54;
        --bg: #fff0fa;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
        font-weight: 500;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(circle at 15% 10%, #ffd6ec 0 18%, transparent 19%),
          radial-gradient(circle at 90% 85%, #c9f3ff 0 22%, transparent 23%),
          var(--bg);
      }
      #app {
        position: relative;
        height: 100%;
        min-height: 100vh;
        max-width: 720px;
        margin: auto;
      }
      .scr {
        display: none;
        position: absolute;
        inset: 0;
        flex-direction: column;
        align-items: center;
        padding: 14px;
        gap: 10px;
        overflow: auto;
      }
      .scr.on {
        display: flex;
      }
      .b {
        font: inherit;
        font-weight: 800;
        font-size: 1.15rem;
        border: 3px solid var(--ink);
        border-radius: 20px;
        padding: 10px 20px;
        background: var(--yl);
        color: var(--ink);
        box-shadow: 0 5px 0 var(--ink);
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .b:hover {
        rotate: -2deg;
        scale: 1.05;
      }
      .b:active {
        translate: 0 4px;
        box-shadow: 0 1px 0 var(--ink);
      }
      .b:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pk {
        background: var(--pk);
      }
      .pu {
        background: var(--pu);
        color: #fff;
      }
      .cy {
        background: var(--cy);
      }
      .or {
        background: var(--or);
      }
      .sk {
        background: var(--sk);
      }
      .rd {
        background: #ff3b4f;
        color: #fff;
      }
      .gr {
        background: #7ee27e;
      }
      .sm {
        padding: 6px 12px;
        font-size: 1rem;
      }
      .wide {
        width: min(80%, 320px);
        font-size: 1.6rem;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .top {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .pill {
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 99px;
        padding: 2px 14px;
        font-weight: 800;
      }
      .logo {
        text-align: center;
        font-weight: 800;
        font-size: clamp(3rem, 13vw, 5.5rem);
        line-height: 0.88;
        color: var(--yl);
        -webkit-text-stroke: 3px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 5px 0 var(--ink);
      }
      .logo span {
        display: block;
      }
      .logo span:first-child {
        rotate: -4deg;
        color: var(--pk);
      }
      .logo span:last-child {
        rotate: 3deg;
      }
      .mascot {
        width: min(46vw, 200px);
        animation: bob 2s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          translate: 0 -8px;
          rotate: 2deg;
        }
      }
      .mon {
        width: 100%;
        display: block;
        overflow: visible;
      }
      .mon.laugh {
        animation: wig 0.25s 4;
      }
      .mon.shock {
        animation: pop 0.4s;
      }
      @keyframes wig {
        50% {
          rotate: 6deg;
        }
      }
      @keyframes pop {
        50% {
          scale: 1.15;
        }
      }
      .prog {
        width: min(70%, 300px);
        height: 16px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 99px;
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--cy);
      }
      h2 {
        margin: 4px 0;
        font-size: 1.8rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 12px;
        width: 100%;
        padding: 6px;
      }
      .lvb {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 1.7rem;
        line-height: 1;
      }
      .lvb small {
        font-size: 0.7rem;
      }
      .list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 8px 14px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .item.off {
        opacity: 0.45;
        filter: grayscale(1);
      }
      #hud {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      #ttl {
        font-weight: 800;
        flex: 1;
        text-align: center;
        line-height: 1.05;
      }
      #ins {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 800;
        text-align: center;
      }
      #stage {
        flex: 1;
        width: 100%;
        min-height: 200px;
        position: relative;
        overflow: hidden;
        container-type: size;
        border: 4px solid var(--ink);
        border-radius: 28px;
        background: linear-gradient(#bfe9ff, #fff4c9);
        touch-action: none;
      }
      .fill {
        position: absolute;
        inset: 0;
        transition: transform 0.9s;
      }
      .o {
        position: absolute;
        transform: translate(-50%, -50%);
        line-height: 1;
        white-space: nowrap;
      }
      .o .b {
        font-size: 5.5cqmin;
        padding: 2cqmin 6cqmin;
      }
      .zc {
        position: absolute;
        bottom: 3%;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .q {
        position: absolute;
        top: 10%;
        width: 100%;
        text-align: center;
        font-size: 10cqmin;
        font-weight: 800;
      }
      .g4 {
        position: absolute;
        top: 30%;
        left: 8%;
        right: 8%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3cqmin;
      }
      .g4 .b {
        font-size: 7cqmin;
      }
      .rain {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          105deg,
          transparent 0 14px,
          #2f8cff88 14px 17px
        );
        animation: rn 0.4s linear infinite;
        pointer-events: none;
      }
      @keyframes rn {
        to {
          background-position: -20px 40px;
        }
      }
      .rug {
        width: 46cqmin;
        height: 16cqmin;
        border-radius: 3cqmin;
        background: repeating-linear-gradient(
          90deg,
          #c0457a 0 4cqmin,
          #ffd93d 4cqmin 8cqmin
        );
        border: 3px solid var(--ink);
      }
      .rug .sp {
        position: absolute;
        right: 2cqmin;
        top: 1cqmin;
        font-size: 5cqmin;
        opacity: 0.7;
        animation: tw 1.2s infinite;
      }
      @keyframes tw {
        50% {
          scale: 1.4;
          opacity: 0.2;
        }
      }
      .rug .cat {
        position: absolute;
        left: 30%;
        top: -9cqmin;
        font-size: 14cqmin;
      }
      .wob {
        animation: wob 0.4s;
      }
      @keyframes wob {
        25% {
          rotate: -8deg;
        }
        75% {
          rotate: 8deg;
        }
      }
      #bub {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 22px;
        padding: 6px 12px;
        min-height: 64px;
      }
      #gm {
        width: 52px;
        flex: none;
      }
      #sp {
        margin: 0;
        font-weight: 800;
      }
      #modal {
        display: none;
        position: absolute;
        inset: 0;
        background: #2b1b54aa;
        z-index: 50;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      #modal.on {
        display: flex;
      }
      .card {
        background: #fff;
        border: 4px solid var(--ink);
        border-radius: 28px;
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        max-width: 380px;
        width: 100%;
        animation: pop 0.35s;
      }
      .card p {
        margin: 0;
      }
      .card .mascot {
        width: 90px;
        animation: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        translate: -50% 0;
        background: var(--ink);
        color: #fff;
        border-radius: 99px;
        padding: 8px 18px;
        font-weight: 800;
        z-index: 99;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #toast.on {
        opacity: 1;
      }
      .shake {
        animation: sh 0.4s;
      }
      @keyframes sh {
        20% {
          translate: -12px 0;
        }
        40% {
          translate: 12px 0;
        }
        60% {
          translate: -8px 0;
        }
        80% {
          translate: 8px 0;
        }
      }
      .cf {
        position: fixed;
        top: -20px;
        width: 10px;
        height: 14px;
        z-index: 99;
        animation: fall 1.8s ease-in forwards;
      }
      @keyframes fall {
        to {
          translate: 40px 110vh;
        }
      }
      input {
        font: inherit;
        font-weight: 800;
        border: 3px solid var(--ink);
        border-radius: 16px;
        padding: 8px 12px;
        width: min(100%, 320px);
        text-align: center;
        user-select: text;
        -webkit-user-select: text;
      }
      .avs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .avs button {
        font-size: 1.8rem;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .avs .sel {
        background: var(--yl);
      }
      .opts {
        position: absolute;
        top: 34%;
        left: 6%;
        right: 6%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3cqmin;
      }
      .opts .b {
        font-size: 4.6cqmin;
        padding: 2cqmin;
      }
      .qq {
        position: absolute;
        top: 5%;
        left: 6%;
        right: 6%;
        text-align: center;
        font-weight: 800;
        font-size: 5.6cqmin;
      }
      .eg {
        position: absolute;
        inset: 5%;
        display: grid;
        gap: 1cqmin;
        place-items: center;
      }
      .eg span {
        cursor: pointer;
        font-size: var(--f);
        line-height: 1;
      }
      .tbar {
        height: 14px;
        border: 3px solid var(--ink);
        border-radius: 99px;
        background: #fff;
        overflow: hidden;
      }
      .tbar i {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #35d6ed, #7c4dff);
        transition: width 1s linear;
      }
      .tbar.hot i {
        background: linear-gradient(90deg, #ff3b4f, #ff9248);
      }
      .tbar.hot {
        animation: sh 0.5s infinite;
      }
      #tmr {
        font-weight: 800;
        min-width: 60px;
        text-align: right;
      }
      .b {
        background-image: linear-gradient(
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0) 55%
        );
      }
      .card {
        box-shadow: 0 8px 0 var(--ink);
      }
      #stage {
        box-shadow: 0 6px 0 var(--ink);
      }
      html {
        overscroll-behavior: none;
      }
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
        #app {
          min-height: 100dvh;
        }
      }
      @supports (height: 100svh) {
        #app {
          min-height: 100svh;
        }
      }
      @media (min-width: 900px) {
        html {
          font-size: 18px;
        }
        #app {
          max-width: 860px;
        }
      }
      @media (max-height: 520px) and (orientation: landscape) {
        #ins {
          font-size: 1rem;
        }
        #bub {
          min-height: 44px;
          padding: 2px 10px;
        }
        #gm {
          width: 36px;
        }
        .logo {
          font-size: 2.6rem;
        }
        .mascot {
          width: 90px;
        }
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        animation: fl 10s ease-in-out infinite;
      }
      body::before {
        width: 180px;
        height: 180px;
        left: -40px;
        top: 20%;
        background: #ffe27a88;
      }
      body::after {
        width: 240px;
        height: 240px;
        right: -60px;
        bottom: 10%;
        background: #9fe9ff88;
        animation-delay: -4s;
      }
      @keyframes fl {
        50% {
          translate: 20px -30px;
        }
      }
      .legs {
        position: relative;
        z-index: 5;
      }
      .legs::before,
      .legs::after {
        content: "";
        position: absolute;
        bottom: -30px;
        width: 8px;
        height: 30px;
        background: var(--ink);
        border-radius: 4px;
        transform-origin: top center;
        box-shadow: 7px 26px 0 -1px var(--ink);
      }
      .legs::before {
        left: 28%;
        animation: run 0.17s infinite;
      }
      .legs::after {
        right: 36%;
        animation: run 0.17s infinite reverse;
      }
      .tired::before,
      .tired::after {
        animation: none;
        rotate: 0deg;
      }
      @keyframes run {
        0% {
          rotate: 38deg;
        }
        50% {
          rotate: -38deg;
        }
        100% {
          rotate: 38deg;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      .scr {
        padding:
          max(12px, env(safe-area-inset-top, 0px))
          max(12px, env(safe-area-inset-right, 0px))
          max(12px, env(safe-area-inset-bottom, 0px))
          max(12px, env(safe-area-inset-left, 0px));
        gap: clamp(8px, 1.5vw, 16px);
      }
      .b {
        min-height: 44px;
      }
      .sm {
        min-height: 40px;
      }
      .top {
        flex-shrink: 0;
      }
      .top > h2 {
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: center;
      }
      #menu .top > span:last-child {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }
      #menu .top > span:last-child .b {
        min-width: 44px;
      }
      #game {
        min-height: 0;
      }
      #stage {
        min-height: clamp(220px, 42dvh, 620px);
      }
      #bub {
        flex-shrink: 0;
      }
      .row {
        width: min(100%, 620px);
      }
      .row .b {
        flex: 1 1 160px;
      }
      @media (max-width: 600px) {
        html,
        body {
          font-size: 15px;
        }
        .scr {
          padding:
            max(10px, env(safe-area-inset-top, 0px))
            max(10px, env(safe-area-inset-right, 0px))
            max(10px, env(safe-area-inset-bottom, 0px))
            max(10px, env(safe-area-inset-left, 0px));
        }
        .logo {
          font-size: clamp(2.7rem, 17vw, 4.5rem);
        }
        .mascot {
          width: min(42vw, 170px);
        }
        .wide {
          width: min(100%, 320px);
          font-size: 1.35rem;
        }
        .row {
          gap: 8px;
        }
        .row .b {
          flex-basis: 135px;
          padding-inline: 12px;
        }
        #hud {
          gap: 4px;
        }
        #ttl {
          font-size: 0.9rem;
        }
        #tmr {
          min-width: 48px;
        }
        #ins {
          font-size: 1.1rem;
          line-height: 1.05;
        }
        #stage {
          min-height: clamp(200px, 42dvh, 460px);
          border-width: 3px;
          border-radius: 22px;
        }
        #bub {
          min-height: 56px;
          padding: 5px 9px;
        }
        #gm {
          width: 42px;
        }
        .item {
          padding-inline: 10px;
        }
        .grid {
          grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
          gap: 8px;
          padding: 2px;
        }
        .lvb {
          font-size: 1.45rem;
        }
        .card {
          padding: 16px;
          border-width: 3px;
          border-radius: 22px;
        }
      }
      @media (min-width: 601px) and (max-width: 1024px) {
        #app {
          max-width: 900px;
        }
        .scr {
          padding: clamp(16px, 3vw, 28px);
        }
        #stage {
          min-height: clamp(280px, 48dvh, 620px);
        }
        .logo {
          font-size: clamp(4rem, 11vw, 6rem);
        }
      }
      @media (min-width: 1025px) {
        #app {
          max-width: 1024px;
        }
        .scr {
          padding: 24px clamp(24px, 4vw, 48px);
        }
        #stage {
          min-height: min(620px, 56dvh);
        }
      }
      @media (max-height: 560px) {
        .scr {
          gap: 6px;
        }
        #stage {
          min-height: 170px;
        }
        #bub {
          min-height: 48px;
        }
        #gm {
          width: 34px;
        }
      }
      .dr {
        overflow: visible;
      }
      .dpanel {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        filter: drop-shadow(0 0.8cqmin 0 rgba(43, 27, 84, 0.3));
      }
      .dback {
        position: absolute;
        inset: 0;
      }
      .sign {
        background: #2fbf71;
        color: #fff;
        border: 3px solid var(--ink);
        border-radius: 8px;
        padding: 0.5cqmin 2.5cqmin;
        font-size: 4cqmin;
        font-weight: 800;
        box-shadow: 0 0.6cqmin 0 var(--ink);
      }
      .sg {
        position: absolute;
        inset: 12% 10%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4cqmin;
      }
      .sq {
        border: 3px solid var(--ink);
        border-radius: 5cqmin;
        box-shadow: 0 1cqmin 0 var(--ink);
        cursor: pointer;
        transition:
          filter 0.1s,
          scale 0.1s;
      }
      .sq.lit {
        filter: brightness(1.7) saturate(1.5);
        scale: 1.06;
        box-shadow: 0 0 5cqmin #fff;
      }
      .tm {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 36%;
        height: 14cqmin;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 99px;
        overflow: hidden;
      }
      .zn {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #4ccf6a;
      }
      .mk {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 10px;
        margin-left: -5px;
        background: var(--ink);
      }
      .blink {
        animation: bk 0.45s infinite;
      }
      @keyframes bk {
        50% {
          opacity: 0.08;
        }
      }
      .lt {
        position: absolute;
        left: 6%;
        right: 6%;
        top: 46%;
        display: flex;
        flex-wrap: wrap;
        gap: 2cqmin;
        justify-content: center;
      }
      .lt .b {
        font-size: 7cqmin;
        padding: 1.2cqmin 3cqmin;
      }
      .rw {
        position: absolute;
        left: 3%;
        right: 3%;
        top: 38%;
        display: flex;
        gap: 2cqmin;
        justify-content: center;
        flex-wrap: wrap;
      }
      .rw .b {
        font-size: 5cqmin;
        padding: 1.6cqmin 2.4cqmin;
      }
      .rw.nw {
        flex-wrap: nowrap;
      }
      .rw.nw .b {
        padding: 1.6cqmin 1.8cqmin;
      }
      .cg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
      }
      .cc {
        aspect-ratio: 1;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 14px;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 4px;
        font-size: 3rem;
        font-family: inherit;
      }
